server {
    listen 80;
    listen [::]:80;
    server_name read.qiaomu.ai;
    location ^~ /.well-known/acme-challenge/ { root /www/wwwroot/read.qiaomu.ai; }
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name read.qiaomu.ai;
    client_max_body_size 110m;

    ssl_certificate /etc/letsencrypt/live/read.qiaomu.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/read.qiaomu.ai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location / {
        proxy_cache off;
        proxy_pass http://127.0.0.1:3487;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
