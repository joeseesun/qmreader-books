<?xml version="1.0" encoding="UTF-8"?>
<html xmlns="http://www.w3.org/1999/xhtml"><head><title>第一章</title></head><body><h1>第一章 阅读不是划过文字</h1><p>真正的阅读不是让眼睛经过每一行，而是在作者的论证与自己的经验之间建立连接。</p><p>当一个概念无法复述时，它通常还没有成为你的知识。停下来提出一个具体问题，比继续翻十页更有效。</p><blockquote>理解的标志不是熟悉，而是能够用自己的语言解释，并知道它在什么条件下可能不成立。</blockquote><p>因此，划线的价值不在于把页面染成黄色，而在于留下一个将来能够回到原文的问题。</p></body></html>
