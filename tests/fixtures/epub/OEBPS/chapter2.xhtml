<html xmlns="http://www.w3.org/1999/xhtml"><head><title>第二章</title></head><body><h1>第二章 把问题留在原文旁边</h1><p>阅读中的问题有三种尺度：针对一句话的澄清、针对一章的结构分析，以及跨越全书的主题追踪。</p><p>好的辅助工具应当尊重这三种尺度。它不替你阅读，而是缩短从困惑到验证之间的距离。</p><p>当回答能够重新指向原文，读者就仍然掌握解释权；当回答脱离上下文，它只是在制造另一段需要判断的文字。</p></body></html>
